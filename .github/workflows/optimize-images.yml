name: GEENIUS - Optimizar imagenes

on:
  push:
    branches:
      - main
    paths:
      - "images/novedades/**"
      - "images/calendario/**"
      - "scripts/optimize_images.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Instalar Pillow
        run: pip install pillow
      - name: Optimizar imagenes
        run: python scripts/optimize_images.py
      - name: Guardar imagenes optimizadas
        run: |
          if [ -z "$(git status --porcelain images)" ]; then
            echo "No hay imagenes que optimizar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Optimiza imagenes subidas"
          git pull --rebase origin main
          git push
